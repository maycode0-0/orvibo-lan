[project]
name = "orvibo-lan"
dynamic = ["version"]
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
 "aiohttp>=3.9,<4",
 "cryptography>=41,<46",
 "voluptuous>=0.13,<1",
 "mypy>=1.11,<2",
 "pytest>=8.3,<9",
 "pytest-asyncio>=0.24,<1",
 "pytest-cov>=5,<7",
"ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/orvibo_lan"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 62
show_missing = true
skip_covered = true
exclude_also = [
 "if TYPE_CHECKING:",
 "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length =100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.orvibo_lan"]

[tool.mypy]
python_version = "3.11"
files = ["custom_components/orvibo_lan"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
