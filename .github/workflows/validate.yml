{
 "name": "Validate",
 "on": {
 "push": {},
 "pull_request": {},
 "workflow_call": {},
 "workflow_dispatch": {}
 },
 "permissions": { "contents": "read" },
 "concurrency": {
 "group": "validate-${{ github.workflow }}-${{ github.ref }}",
 "cancel-in-progress": true
 },
 "jobs": {
 "quality": {
 "name": "Ruff and mypy",
 "runs-on": "ubuntu-latest",
 "steps": [
 { "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" },
 {
 "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
 "with": { "python-version": "3.11", "cache": "pip" }
 },
 { "name": "Install development tools", "run": "python -m pip install --upgrade 'pip>=25.1,<26'\npython -m pip install --group dev" },
 { "name": "Ruff", "run": "ruff check custom_components tests" },
 {
 "name": "mypy",
 "run": "mypy custom_components/orvibo_lan"
 }
 ]
 },
 "tests": {
 "name": "pytest with coverage",
 "runs-on": "ubuntu-latest",
 "steps": [
 { "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" },
 {
 "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
 "with": { "python-version": "3.11", "cache": "pip" }
 },
 { "name": "Install test dependencies", "run": "python -m pip install --upgrade 'pip>=25.1,<26'\npython -m pip install --group dev" },
 { "name": "Run tests", "run": "pytest --cov=custom_components.orvibo_lan --cov-report=term-missing --cov-report=xml" }
 ]
 },
 "package-contract": {
 "name": "Package and release contracts",
 "runs-on": "ubuntu-latest",
 "steps": [
 { "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" },
 { "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", "with": { "python-version": "3.11" } },
 { "name": "Run standard-library contract tests", "run": "python -m unittest discover -s tests -p 'test_package_contract.py' -v\npython -m unittest discover -s tests -p 'test_release_workflow.py' -v" }
 ]
 },
 "hacs": {
 "name": "HACS validation",
 "runs-on": "ubuntu-latest",
 "steps": [
 { "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" },
 { "uses": "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa", "with": { "category": "integration" } }
 ]
 },
 "hassfest": {
 "name": "Home Assistant hassfest",
 "runs-on": "ubuntu-latest",
 "steps": [
 { "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" },
 { "uses": "home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb" }
 ]
 },
 "actionlint": {
 "name": "GitHub Actions syntax",
 "runs-on": "ubuntu-latest",
 "steps": [
 { "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" },
 { "uses": "rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106" }
 ]
 }
 }
}
